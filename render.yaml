services:
  - type: web
    name: solvaa
    runtime: node
    plan: free
    healthCheckPath: /health
    buildCommand: npm ci --include=dev && npm --prefix server ci --omit=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22
      - key: AI_ENABLED
        value: "false"
